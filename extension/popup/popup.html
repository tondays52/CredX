<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CredX Node</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CredX Virtual Node</h1>
      <div id="statusBadge" class="badge disconnected">Disconnected</div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">CredX Points</span>
        <span class="stat-value" id="pointsValue">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Uptime</span>
        <span class="stat-value" id="uptimeValue">00:00:00</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Bandwidth Shared</span>
        <span class="stat-value" id="bandwidthValue">0 MB</span>
      </div>
      <div class="stat-card highlight">
        <span class="stat-label">Credit Score</span>
        <span class="stat-value" id="scoreValue">---</span>
      </div>
    </div>

    <div class="actions">
      <button id="toggleNodeBtn" class="btn primary">Start Node</button>
      <button id="syncChainBtn" class="btn outline" disabled>Sync to Chain</button>
    </div>
    
    <div id="txStatus" class="tx-status hidden"></div>
  </div>
  
  <script src="../lib/ethers.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
