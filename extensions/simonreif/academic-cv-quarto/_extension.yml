title: academic-cv-quarto
author: Simon Reif
version: 0.1.0
description: "A modern, flexible CV template using Quarto and Typst. Features customizable colors, social media links and research interests."
quarto-required: ">=1.7.0"
contributes:
  shortcodes:
    - cv-entry.lua
  formats:
    typst:
      filters:
        - parse-bibtex.lua
      template-partials:
        - typst-show.typ

source: simonreif/academic-cv-quarto@v0.1.0
source-type: registry
